services:
  rec-console:
    build:
      context: .
    image: openrec/rec-console:latest
    container_name: rec-console
    hostname: rec-console
    restart: unless-stopped
    environment:
      OPENREC_MODE: standalone
      GRAFANA_URL: http://grafana:3000
      REC_SERVER_URL: http://rec-server:13579
      SERVING_GRAPH_TOKEN: ${SERVING_GRAPH_TOKEN:-openrec-serving-graph-token-change-me}
    ports:
      - "8095:8095"
    networks:
      - openrec-bigdata
    volumes:
      - rec-console-data:/var/lib/rec-console
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8095/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  openrec-bigdata:
    external: true
    name: openrec-bigdata

volumes:
  rec-console-data:
