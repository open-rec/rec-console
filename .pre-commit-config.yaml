default_install_hook_types: [pre-commit, pre-push]
files: ^rec_console/.*\.py$
repos:
  - repo: local
    hooks:
      - id: python-imports
        name: Check Python import order
        entry: python -m isort --check-only --diff
        language: python
        additional_dependencies: [isort==9.0.2]
        types: [python]
      - id: python-format
        name: Check Python formatting
        entry: python -m autopep8 --diff --exit-code
        language: python
        additional_dependencies: [autopep8==2.3.2, pycodestyle==2.15.0]
        types: [python]
      - id: python-pep8
        name: Check PEP 8
        entry: python -m pycodestyle
        language: python
        additional_dependencies: [pycodestyle==2.15.0]
        types: [python]
